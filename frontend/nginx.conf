server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/v1/corp {
    proxy_pass http://corp:8082;
  }

  location /api/v1/room {
    proxy_pass http://corp:8082;
  }

  location /api/v1/reservation {
    proxy_pass http://corp:8082;
  }

  location /api/v1/search {
    proxy_pass http://corp:8082;
  }

  location /api/v1/batch {
    proxy_pass http://batch:8083;
  }

  location /api {
    proxy_pass http://api:8081;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
